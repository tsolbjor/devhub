# AWS Workload Cluster configuration
# Runs application workloads only — no platform services (Keycloak, Vault, GitLab, ArgoCD).
# Data service values are NOT needed here (they live on the platform cluster).
# External-DNS IAM is populated by: sync-tofu-outputs.sh --env aws-workload

# Domain for app ingresses (can share the same domain as the platform cluster) - UPDATE THIS
domain: example.com

# TLS via cert-manager (Let's Encrypt)
tls:
  type: cert-manager
  secretName: ""
  clusterIssuer: letsencrypt-prod

# Email for ACME certificate notifications - UPDATE THIS
acmeEmail: admin@example.com

# External-DNS — populated by sync-tofu-outputs.sh
externalDns:
  irsaRoleArn: PENDING_TOFU_OUTPUT

# Vault API URL on the platform cluster (for External Secrets Operator)
# UPDATE THIS after the platform cluster is running
platformVaultUrl: https://vault.example.com
