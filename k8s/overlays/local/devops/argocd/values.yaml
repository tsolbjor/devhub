# ArgoCD local overlay — only what differs from base/devops/argocd/values.yaml.
#
# The domain, SSO client and RBAC policy used to be repeated here verbatim; base
# carries them now (it templates ${DOMAIN} like every other values file), so what
# is left is the two things that are true only on a laptop, plus the empty secret
# key the local flow fills in.

configs:
  params:
    # TLS terminates at the Gateway.
    server.insecure: true

  cm:
    # The local CA is self-signed, so ArgoCD's OIDC client cannot verify it.
    oidc.tls.insecure.skip.verify: "true"

  secret:
    extra:
      oidc.keycloak.clientSecret: ""
