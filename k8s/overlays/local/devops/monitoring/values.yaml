# Monitoring local overlay — only what differs from
# base/devops/monitoring/prometheus-stack-values.yaml.
#
# The Grafana SSO block, the OIDC client-secret env and the three
# managed-control-plane scrape targets used to live here in full; base carries
# them now (identically, in every environment), so this file is down to what is
# only true on a laptop.

grafana:
  # k3s/Rancher Desktop: the chart's chown init container cannot write the
  # hostPath-backed volume and the pod never starts.
  initChownData:
    enabled: false

# ─── k3s folds kube-proxy into the agent ─────────────────────────────
# The controller manager, scheduler and etcd targets are disabled in base for
# every environment. kube-proxy is the local-only one: k3s runs it inside the
# server/agent process with its metrics endpoint on 127.0.0.1, so
# KubeProxyDown fires critical from the first sync. On a cloud cluster it is a
# real DaemonSet with a real endpoint, so it stays enabled there.
kubeProxy:
  enabled: false

# ─── WSL2's clock makes one rule meaningless ─────────────────────────
# process_start_time_seconds is derived from the node's boot time
# (wall_clock - uptime). WSL2's wall clock jumps forward in bursts — measurably
# ~7s of clock per 3s of real time — so that subtraction drifts and the metric
# reports a *new* process start on nearly every scrape, while the pod's restart
# count stays 0.
#
# AlertmanagerClusterCrashlooping counts exactly that
# (changes(process_start_time_seconds[10m]) > 4), so on WSL2 it fires
# permanently against an Alertmanager that has run untouched for hours — and
# `validate --e2e` then fails "no critical alert is firing" on a perfectly
# healthy environment. Same reason as kubeProxy above: a check that cannot be
# true here hides the ones that can.
#
# NodeClockNotSynchronising is the honest report of this and stays enabled — it
# is a warning, and it is describing something real about the host.
#
# Alert *routing* is no longer overridden here: base defaults to the
# platform-null receiver for exactly the reason this file used to explain.
defaultRules:
  disabled:
    AlertmanagerClusterCrashlooping: true
