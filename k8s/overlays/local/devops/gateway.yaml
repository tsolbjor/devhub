# Gateway API entry point for the platform.
#
# Replaces the per-service Ingress objects. One Gateway owns listeners and TLS;
# each service owns its own HTTPRoute in its own namespace (see httproutes.yaml).
#
# TLS comes from the local CA: one wildcard secret covers every listener.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devhub
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    # Plain HTTP exists only to redirect; see the redirect route below.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: keycloak-https
      protocol: HTTPS
      port: 443
      hostname: "keycloak.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
    - name: vault-https
      protocol: HTTPS
      port: 443
      hostname: "vault.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
    - name: git-https
      protocol: HTTPS
      port: 443
      hostname: "git.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
    - name: ci-https
      protocol: HTTPS
      port: 443
      hostname: "ci.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: "argocd.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
    - name: grafana-https
      protocol: HTTPS
      port: 443
      hostname: "grafana.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
    - name: prometheus-https
      protocol: HTTPS
      port: 443
      hostname: "prometheus.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
    - name: headlamp-https
      protocol: HTTPS
      port: 443
      hostname: "headlamp.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: local-tls-secret
---
# Everything on :80 is redirected to :443. Attached to the http listener only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: devhub
      namespace: gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
