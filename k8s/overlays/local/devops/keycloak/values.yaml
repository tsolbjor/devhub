# Keycloak local overlay values
# Chart: codecentric/keycloakx
# Merged with base/devops/keycloak/values.yaml
# Uses ${DOMAIN} and ${TLS_SECRET_NAME} from config.yaml

# Single replica for local dev
replicas: 1

# Use local cache (no clustering needed for single-replica local dev)
args:
  - "start"
  - "--hostname-strict=false"
  - "--cache=local"

# Override hostname for local environment
# KC_HOSTNAME must be a bare hostname in Keycloak 26.x (no https:// prefix)
extraEnv: |
  - name: KEYCLOAK_ADMIN
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: KEYCLOAK_ADMIN
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: KEYCLOAK_ADMIN_PASSWORD
  - name: KC_HOSTNAME
    value: "keycloak.${DOMAIN}"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_FEATURES
    value: "token-exchange,admin-fine-grained-authz"

# Ingress configuration for local
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  rules:
    - host: keycloak.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ${TLS_SECRET_NAME}
      hosts:
        - keycloak.${DOMAIN}
