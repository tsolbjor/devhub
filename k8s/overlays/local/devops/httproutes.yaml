# HTTPRoutes for the platform services.
#
# Each route lives in the namespace of the service it points at, which is the
# structural advantage of Gateway API over Ingress: a team can own its routing
# without permission to edit platform TLS.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: devhub
      namespace: gateway
      sectionName: keycloak-https
  hostnames:
    - "keycloak.${DOMAIN}"
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
---
