# Azure DEV environment configuration
#
# Human-owned configuration. Infrastructure values (database hosts, IAM role
# ARNs, bucket names, KMS keys) are NOT stored here — sync-tofu-outputs.sh writes
# them to k8s/scripts/azure-dev/tofu-outputs.env, which deploy.sh sources.

# Domain configuration - UPDATE THIS
domain: dev.example.com

# TLS configuration
tls:
  type: cert-manager       # local-ca or cert-manager
  secretName: ""           # cert-manager creates per-service secrets
  clusterIssuer: letsencrypt-prod

# Email for ACME certificate notifications - UPDATE THIS
acmeEmail: admin@dev.example.com

# Data services: managed (cloud) or local (in-cluster StatefulSets)
dataServices:
  type: managed

# GitOps: repository ArgoCD reconciles the platform and app manifests from.
# Defaults to the Forgejo instance this platform runs, once it hosts the repo.
gitops:
  repoUrl: https://git.dev.example.com/devhub/devhub.git
  targetRevision: HEAD

# Service subdomains (relative to domain)
services:
  keycloak: keycloak
  vault: vault
  git: git          # Forgejo: repositories, packages and the container registry
  ci: ci            # Woodpecker
  argocd: argocd
  grafana: grafana
  prometheus: prometheus
  alertmanager: alertmanager
  loki: loki
  headlamp: headlamp
