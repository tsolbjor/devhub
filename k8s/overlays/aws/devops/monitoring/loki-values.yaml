# Loki AWS overlay: S3 object storage backend
# Requires:
#   - S3 bucket named ${S3_BUCKET_PREFIX}-loki (add to tofu/aws/modules/cluster)
#   - IAM role with S3 read/write on that bucket (add to tofu/aws/modules/cluster)
#   - config.yaml: loki.irsaRoleArn — exported from tofu output loki_irsa_role_arn

loki:
  storage:
    type: s3
    s3:
      bucketnames: ${S3_BUCKET_PREFIX}-loki
      region: ${AWS_REGION}
      s3forcepathstyle: false
      insecure: false

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# IRSA annotation grants the Loki pod access to S3 without static credentials
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "${LOKI_IRSA_ROLE_ARN}"

# Switch from filesystem to S3 — disable local PVC
singleBinary:
  persistence:
    enabled: false
