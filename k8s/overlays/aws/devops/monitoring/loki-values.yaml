# Loki AWS overlay: S3 object storage backend.
#
# Provisioned by tofu/aws/modules/cluster/platform.tf:
#   - S3 bucket (output: loki_bucket) with lifecycle expiry
#   - IRSA role for serviceaccount monitoring/loki (output: loki_irsa_role_arn)
# sync-tofu-outputs.sh exports both as LOKI_BUCKET / LOKI_IRSA_ROLE_ARN.
#
# deploy.sh applies this overlay only when LOKI_IRSA_ROLE_ARN is set.

loki:
  # Retention is enforced by the compactor; the delete store must match the
  # object-storage backend configured below.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: s3

  storage:
    type: s3
    s3:
      bucketnames: ${LOKI_BUCKET}
      region: ${AWS_REGION}
      s3forcepathstyle: false
      insecure: false

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# IRSA annotation grants the Loki pod access to S3 without static credentials
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "${LOKI_IRSA_ROLE_ARN}"

# Chunks live in S3, but the base overlay's PVC stays: the compactor, WAL and
# tsdb index cache all write under /var/loki, and the chart's root filesystem
# is read-only — with the PVC disabled Loki crash-loops on
# "mkdir /var/loki: read-only file system".

