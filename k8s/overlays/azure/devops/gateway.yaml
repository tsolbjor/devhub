# Gateway API entry point for the platform.
#
# Replaces the per-service Ingress objects. One Gateway owns listeners and TLS;
# each service owns its own HTTPRoute in its own namespace (see httproutes.yaml).
#
# cert-manager watches this Gateway and issues one certificate per listener
# (the gateway-shim). Each listener names the Secret the certificate lands in.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devhub
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: ${CLUSTER_ISSUER}
spec:
  gatewayClassName: envoy
  listeners:
    # Plain HTTP exists only to redirect; see the redirect route below.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: keycloak-https
      protocol: HTTPS
      port: 443
      hostname: "keycloak.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: keycloak-tls
    - name: vault-https
      protocol: HTTPS
      port: 443
      hostname: "vault.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vault-tls
    - name: git-https
      protocol: HTTPS
      port: 443
      hostname: "git.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: git-tls
    - name: ci-https
      protocol: HTTPS
      port: 443
      hostname: "ci.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ci-tls
    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: "argocd.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-tls
    - name: grafana-https
      protocol: HTTPS
      port: 443
      hostname: "grafana.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: grafana-tls
    - name: prometheus-https
      protocol: HTTPS
      port: 443
      hostname: "prometheus.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: prometheus-tls
    - name: headlamp-https
      protocol: HTTPS
      port: 443
      hostname: "headlamp.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: headlamp-tls
    - name: homepage-https
      protocol: HTTPS
      port: 443
      hostname: "home.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: homepage-tls
    - name: portal-https
      protocol: HTTPS
      port: 443
      hostname: "portal.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: portal-tls
    - name: loki-https
      protocol: HTTPS
      port: 443
      hostname: "loki.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: loki-tls
---
# Everything on :80 is redirected to :443. Attached to the http listener only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: devhub
      namespace: gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
