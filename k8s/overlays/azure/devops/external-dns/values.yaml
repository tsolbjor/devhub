# external-dns Azure overlay — Azure DNS provider via Workload Identity
# The managed identity client ID is provisioned by tofu and written to the env
# files by sync-tofu-outputs.sh.

provider: azure

# The Azure provider reads /etc/kubernetes/azure.json — the chart has no
# `azure:` values key, so the file arrives as a Secret (created by deploy.sh's
# install_external_dns: tenantId, subscriptionId, useWorkloadIdentityExtension;
# no resourceGroup, so zones are found by the domain filter and access is
# bounded by the identity's DNS Zone Contributor role).
extraVolumes:
  - name: azure-config
    secret:
      secretName: external-dns-azure-config
extraVolumeMounts:
  - name: azure-config
    mountPath: /etc/kubernetes/azure.json
    subPath: azure.json
    readOnly: true

# Workload Identity: annotate the service account so AKS binds the federated credential
serviceAccount:
  annotations:
    azure.workload.identity/client-id: ${EXTERNAL_DNS_IDENTITY_CLIENT_ID}

# Workload Identity requires this pod label
podLabels:
  azure.workload.identity/use: "true"

domainFilters:
  - ${DOMAIN}
