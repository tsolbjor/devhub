# Loki Azure overlay: Azure Blob Storage backend.
#
# Provisioned by tofu/azure/modules/cluster/platform.tf:
#   - blob container (output: loki_container) with a lifecycle expiry rule
#   - user-assigned identity + federated credential for monitoring/loki
#     (output: loki_identity_client_id)
# sync-tofu-outputs.sh exports both as LOKI_CONTAINER / LOKI_IDENTITY_CLIENT_ID.

loki:
  # Retention is enforced by the compactor; the delete store must match the
  # object-storage backend configured below.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: azure

  storage:
    type: azure
    # The chart's statefulset template hard-requires bucketNames.chunks for
    # every object-storage type ("Please define loki.storage.bucketNames..."),
    # even though on Azure the container below is what is actually used.
    bucketNames:
      chunks: ${LOKI_CONTAINER}
      ruler: ${LOKI_CONTAINER}
      admin: ${LOKI_CONTAINER}
    azure:
      accountName: ${AZURE_STORAGE_ACCOUNT}
      containerName: ${LOKI_CONTAINER}
      useFederatedToken: true

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Workload Identity annotation + pod label grants the Loki pod access to Blob Storage
serviceAccount:
  annotations:
    azure.workload.identity/client-id: "${LOKI_IDENTITY_CLIENT_ID}"


singleBinary:
  # Pod label required for Azure Workload Identity webhook to inject credentials
  podLabels:
    azure.workload.identity/use: "true"
  persistence:
    enabled: false
