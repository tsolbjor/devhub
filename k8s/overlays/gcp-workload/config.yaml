# GCP workload cluster configuration
#
# Runs application workloads only — no platform services (Keycloak, Vault,
# Forgejo, ArgoCD). Infrastructure values come from
# k8s/scripts/gcp-workload/tofu-outputs.env (written by sync-tofu-outputs.sh).

# Domain for app ingresses - UPDATE THIS
domain: apps.example.com

# TLS via cert-manager (Let's Encrypt)
tls:
  type: cert-manager
  secretName: ""
  clusterIssuer: letsencrypt-prod

# Email for ACME certificate notifications - UPDATE THIS
acmeEmail: admin@apps.example.com

# Platform cluster endpoints this cluster depends on - UPDATE THESE
# Vault: External Secrets Operator pulls app secrets from here.
# Loki:  Alloy ships this cluster's logs here (requires the platform Loki
#        ingress, which deploy.sh only creates when auth is configured).
platformVaultUrl: https://vault.example.com
platformLokiUrl: https://loki.example.com
