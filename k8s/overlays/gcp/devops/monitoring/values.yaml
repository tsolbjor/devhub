# Monitoring GCP overlay values
# Merged with base/devops/monitoring/prometheus-stack-values.yaml

grafana:

  grafana.ini:
    server:
      root_url: https://grafana.${DOMAIN}
    auth.generic_oauth:
      auth_url: https://keycloak.${DOMAIN}/realms/devops/protocol/openid-connect/auth
      token_url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/devops/protocol/openid-connect/token
      api_url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/devops/protocol/openid-connect/userinfo

  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc-secret
        key: client-secret

# ─── Managed control plane: stop scraping what is not reachable ──────
# kube-prometheus-stack enables ServiceMonitors for kube-controller-manager,
# kube-scheduler and etcd by default. On GKE the control plane is managed
# and those endpoints are not exposed to the cluster at all, so the scrapes fail
# forever and KubeControllerManagerDown / KubeSchedulerDown / the etcd* rules
# sit permanently critical. That is not a monitoring gap being surfaced — it is
# noise that buries real alerts, and the alert channel only works if everything
# in it means something.
#
# Disabling each of these switches off both its ServiceMonitor and the alert
# rules that depend on it.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

# kubeProxy stays enabled: this cluster is standard GKE, not Dataplane V2 (no datapath_provider is set
# in tofu/gcp/modules/cluster), so kube-proxy is still the datapath and the
# target is real. Switching the cluster to Dataplane V2 removes kube-proxy
# entirely — disable it here at the same time.

