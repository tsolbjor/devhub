# Loki GCP overlay: GCS object storage backend.
#
# Provisioned by tofu/gcp/modules/cluster/platform.tf:
#   - GCS bucket (output: loki_bucket) with a lifecycle expiry rule
#   - service account + Workload Identity binding for monitoring/loki
#     (output: loki_gsa_email)
# sync-tofu-outputs.sh exports both as LOKI_BUCKET / LOKI_GSA_EMAIL.

loki:
  # Retention is enforced by the compactor; the delete store must match the
  # object-storage backend configured below.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: gcs

  storage:
    type: gcs
    gcs:
      bucketname: ${LOKI_BUCKET}
      chunkBufferSize: 0
      requestTimeout: 0s

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: gcs
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Workload Identity annotation grants the Loki pod access to GCS without a key file
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "${LOKI_GSA_EMAIL}"


singleBinary:
  persistence:
    enabled: false
