# App-of-Apps: root ArgoCD Application.
#
# Manages every other Application/ApplicationSet in this directory.
# deploy.sh templates ${GITOPS_REPO_URL_INTERNAL} / ${GITOPS_REVISION} from
# overlays/<env>/config.yaml before applying — a hardcoded local URL would point
# a cloud environment's ArgoCD at a repository that does not exist.
#
# _INTERNAL, not the plain URL: on local the repository is only reachable from
# inside the cluster by Forgejo's Service name. See common.sh for why a hostAlias
# cannot paper over a *.localhost hostname.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devhub-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: ${GITOPS_REPO_URL_INTERNAL}
    targetRevision: ${GITOPS_REVISION}
    path: k8s/argocd/apps
    directory:
      recurse: false
      exclude: 'app-of-apps.yaml'  # Don't include self

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
