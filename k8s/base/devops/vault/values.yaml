# HashiCorp Vault Helm values
# Chart: hashicorp/vault
# Docs: https://developer.hashicorp.com/vault/docs/platform/k8s/helm
#
# Domain configuration is provided by overlays:
#   - overlays/local/devops/vault/values.yaml
#   - overlays/upcloud/devops/vault/values.yaml

global:
  enabled: true
  tlsDisable: true  # Using TLS at ingress level, not in vault

server:
  # Set VAULT_ADDR to use HTTP inside cluster
  extraEnvironmentVars:
    VAULT_ADDR: "http://127.0.0.1:8200"
  
  # Run in HA mode with Raft storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"

          # Without this, /v1/sys/metrics requires a token and the chart's
          # ServiceMonitor (serverTelemetry below) scrapes it anonymously — so
          # every scrape returned 403 and vault_core_unsealed never reached
          # Prometheus, which made the VaultSealed alert unable to fire. The
          # endpoint is reachable only from inside the cluster (the Vault
          # NetworkPolicy admits the gateway, ESO and Prometheus) and exposes
          # operational counters, not secrets.
          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

        # Vault only keeps Prometheus-formatted metrics when asked to.
        # disable_hostname keeps the pod name out of every metric name — it is
        # already a label, and baking it in makes the series unaggregatable.
        telemetry {
          prometheus_retention_time = "24h"
          disable_hostname = true
        }

  # Resources
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Persistent storage
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: null  # Use default

  # Routing is a Gateway API HTTPRoute (overlays/<env>/devops/httproutes.yaml).
  ingress:
    enabled: false

  # Audit logging
  auditStorage:
    enabled: true
    size: 10Gi

# Vault UI
ui:
  enabled: true
  serviceType: ClusterIP

# Injector for sidecar injection
injector:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# CSI provider (alternative to injector)
csi:
  enabled: false

# Prometheus metrics
serverTelemetry:
  serviceMonitor:
    enabled: true
