# PersistentVolumeClaim for GitLab Runner cache
# Referenced by the runner config in gitlab/values.yaml under
# runners.kubernetes.volumes.pvc (mount path: /cache).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-runner-cache
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
