# ClusterIssuers for cert-manager
# Apply after cert-manager is installed
# Email is templated from $ACME_EMAIL environment variable
---
# Staging issuer - use for testing (not rate limited)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      # Routing here is Gateway API — there is no ingress controller, so an
      # ingress-class solver presents a challenge nothing ever serves and
      # every certificate stays pending forever. cert-manager instead attaches
      # a temporary HTTPRoute to the platform Gateway; its exact-path match
      # outranks the blanket HTTP→HTTPS redirect for the challenge URL.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: devhub
                namespace: gateway
---
# Production issuer - use for real certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      # Routing here is Gateway API — there is no ingress controller, so an
      # ingress-class solver presents a challenge nothing ever serves and
      # every certificate stays pending forever. cert-manager instead attaches
      # a temporary HTTPRoute to the platform Gateway; its exact-path match
      # outranks the blanket HTTP→HTTPS redirect for the challenge URL.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: devhub
                namespace: gateway
