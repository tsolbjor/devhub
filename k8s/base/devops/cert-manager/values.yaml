# cert-manager Helm values
# Chart: jetstack/cert-manager
# Docs: https://cert-manager.io/docs/

installCRDs: true

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

cainjector:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Prometheus metrics
prometheus:
  enabled: true
  servicemonitor:
    enabled: true

# Gateway API support: cert-manager watches Gateway listeners annotated with
# cert-manager.io/cluster-issuer and issues one certificate per listener (the
# "gateway shim"), and solves HTTP-01 challenges with a temporary HTTPRoute.
# Without this flag the Gateway's listeners would have no certificates at all.
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true
