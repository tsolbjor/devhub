# ArgoCD Helm values
# Chart: argo/argo-cd
# Docs: https://argo-cd.readthedocs.io/
#
# ${DOMAIN} is substituted by template_values, so this file is complete on its
# own. The four cloud overlays used to repeat it verbatim to do nothing but swap
# example.com for the real domain; only local still overrides, for TLS at the
# gateway and its self-signed CA.
global:
  domain: argocd.${DOMAIN}

# Server
server:
  replicas: 2
  priorityClassName: platform-critical

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Routing is a Gateway API HTTPRoute (base/devops/httproutes.yaml).
  ingress:
    enabled: false

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Repo server
repoServer:
  replicas: 2
  priorityClassName: platform-critical
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Application controller
controller:
  replicas: 1  # Controller runs as singleton
  priorityClassName: platform-critical
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis
redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ApplicationSet controller
applicationSet:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Notifications
notifications:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Dex (disable if using Keycloak directly)
dex:
  enabled: false

configs:
  # ─── Server configuration and SSO ──────────────────────────────────
  cm:
    create: true
    url: https://argocd.${DOMAIN}
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.${DOMAIN}/realms/devops
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]

  # ─── RBAC ──────────────────────────────────────────────────────────
  # Group names must match the Keycloak realm groups exactly
  # (devops-admins / developers / viewers). The previous policy referenced
  # "/devops-admins" and an "admins" group that does not exist, so nobody
  # was ever granted admin and everyone silently fell back to read-only.
  rbac:
    create: true
    policy.default: role:readonly
    policy.csv: |
      g, devops-admins, role:admin
      g, developers, role:readonly
      g, viewers, role:readonly
    scopes: "[groups, email]"

  params:
    # Application controller resource tracking
    application.instanceLabelKey: argocd.argoproj.io/instance
    # TLS is terminated by the Gateway, so the server speaks plain HTTP inside
    # the cluster. Without this it would redirect to HTTPS in a loop.
    server.insecure: true

  # Known hosts for Git SSH
  ssh:
    knownHosts: |
      # Add the Forgejo SSH host key if repositories are cloned over SSH
      # git.example.com ssh-ed25519 AAAA...

  # Keycloak client secret — populated by setup-keycloak.sh
  secret:
    extra:
      oidc.keycloak.clientSecret: ""
