# Platform credentials delivered from Vault by External Secrets Operator.
#
# Why: the platform installs Vault and ESO, then kept its own credentials as
# hand-rolled `kubectl create secret` output with no rotation path and no single
# source of truth. Rotating a database password meant editing a Secret in
# every namespace that referenced it and hoping nothing was missed.
#
# Now: Vault holds the values under secret/platform/*, and these ExternalSecrets
# project them into the namespaces that need them. Rotation is a
# `vault kv patch` plus a rollout restart — no kubectl secret editing, and the
# value is auditable.
#
# `patch`, not `put`: several of these paths hold multiple properties (the
# postgres secret carries every service's password), and `kv put` replaces the
# whole secret version — rotating one property with `put` silently deletes the
# rest, and the ExternalSecrets referencing them start failing on their next
# refresh.
#
# Applied by: deploy.sh --env <env> platform-secrets
# Seeded by:  setup-vault.sh --env <env> seed-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-db-secret
    creationPolicy: Owner
  data:
    # The Keycloak Operator reads both keys from this secret.
    - secretKey: username
      remoteRef:
        key: platform/postgres
        property: keycloak-username
    - secretKey: password
      remoteRef:
        key: platform/postgres
        property: keycloak-password
---
# Forgejo reads this as an environment override (FORGEJO__database__PASSWD), wired
# up in the chart values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: forgejo-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/postgres
        property: forgejo-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana
        property: admin-password
---
# Alertmanager's Slack webhook. Empty until someone puts a real webhook in Vault:
#   vault kv put secret/platform/alertmanager webhook-url=https://hooks.slack.com/...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: platform/alertmanager
        property: webhook-url
