# Platform alert rules.
#
# kube-prometheus-stack ships generic Kubernetes alerts; these cover the things
# specific to this platform that would otherwise fail quietly — a sealed Vault, a
# stuck ArgoCD sync, certificates that never renewed, backups that stopped.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devhub-platform
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: devhub.vault
      rules:
        - alert: VaultSealed
          expr: vault_core_unsealed == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Vault is sealed ({{ $labels.pod }})"
            description: >-
              A sealed Vault means External Secrets stops delivering credentials and
              every dependent workload degrades on its next secret refresh.
              With KMS auto-unseal configured this should never last past a restart.

        - alert: VaultNoLeader
          expr: sum(vault_core_active) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Vault has no active node"
            description: "The raft cluster has no leader — writes are failing."

    - name: devhub.certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} expires in under 14 days"
            description: "cert-manager has not renewed it — check the Certificate and Order resources."

        - alert: CertificateRenewalFailing
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} is not ready"
            description: "ACME challenge or DNS propagation is failing."

    - name: devhub.gitops
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} out of sync for 30m"
            description: "Auto-sync is enabled, so a persistent drift means sync is erroring."

        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is degraded"

    - name: devhub.backups
      rules:
        - alert: VeleroBackupFailed
          expr: increase(velero_backup_failure_total[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Velero backup failed ({{ $labels.schedule }})"
            description: "Cluster state is no longer being backed up."

        - alert: VeleroNoRecentBackup
          expr: time() - velero_backup_last_successful_timestamp > 172800
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful Velero backup in 48h"

        - alert: VaultSnapshotJobFailed
          expr: kube_job_status_failed{namespace="vault", job_name=~"vault-raft-snapshot.*"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Vault raft snapshot job failed"
            description: "Vault's own storage is not being snapshotted — restore would rely on cloud volume backups only."

    - name: devhub.platform
      rules:
        - alert: PersistentVolumeFillingUp
          expr: |
            (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.15
            and on(persistentvolumeclaim) kube_persistentvolumeclaim_labels{namespace=~"vault|monitoring|forgejo|woodpecker|data-services"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is over 85% full"

        - alert: PlatformPodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace=~"vault|keycloak|forgejo|woodpecker|argocd|monitoring|external-secrets|envoy-gateway-system"
            }[30m]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"

        - alert: IngressCertificateServedIsSelfSigned
          expr: probe_ssl_earliest_cert_expiry == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "An ingress is serving a certificate with no expiry (default/self-signed)"
