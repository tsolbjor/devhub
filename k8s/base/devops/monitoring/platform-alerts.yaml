# Platform alert rules.
#
# kube-prometheus-stack ships generic Kubernetes alerts; these cover the things
# specific to this platform that would otherwise fail quietly — a sealed Vault, a
# stuck ArgoCD sync, certificates that never renewed, backups that stopped.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devhub-platform
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: devhub.vault
      rules:
        # Absence is the signal, not a gap in it. A sealed Vault answers 503 on
        # /v1/sys/metrics, so the metric this alert is named after *disappears*
        # exactly when it matters — `vault_core_unsealed == 0` alone can only
        # fire in the narrow case where Vault still serves metrics while sealed.
        # The three arms cover: target down, metric never present at all
        # (a scrape that has never succeeded — e.g. the telemetry stanza in
        # base/devops/vault/values.yaml missing, which is how this alert was
        # silent), and the literal sealed reading.
        #
        # The last arm aggregates with max() rather than reading the raw series,
        # because Vault exports *two* of them and one is a permanent artefact:
        #   vault_core_unsealed{cluster=""} 0
        #   vault_core_unsealed{cluster="vault-cluster-a52b2f0d"} 1
        # The empty-cluster series is emitted before the cluster name is known —
        # i.e. while sealed — and Vault keeps exporting it at 0 for the life of
        # the process. `vault_core_unsealed == 0` therefore matched forever after
        # the first unseal, and this critical alert fired permanently against a
        # perfectly healthy Vault on every Shamir install (local, UpCloud). A
        # critical that can never clear is worse than no alert: it trains people
        # to ignore the channel that carries the real ones.
        #
        # max() by pod is the honest reading of "is any part of this Vault
        # unsealed" — while genuinely sealed, no series reports 1 and the alert
        # still fires.
        - alert: VaultSealed
          expr: |
            up{job=~".*vault.*"} == 0
            or absent(vault_core_unsealed)
            or max by (namespace, pod) (vault_core_unsealed) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Vault is sealed or unreachable ({{ $labels.pod }})"
            description: >-
              A sealed Vault means External Secrets stops delivering credentials and
              every dependent workload degrades on its next secret refresh.
              With KMS auto-unseal configured this should never last past a restart.
              An unreachable metrics endpoint counts: a sealed Vault returns 503
              there, so silence and sealed look the same from outside.

        - alert: VaultNoLeader
          expr: |
            absent(vault_core_active) or sum(vault_core_active) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Vault has no active node"
            description: >-
              The raft cluster has no leader — writes are failing. Absence of the
              metric counts the same way: a quorum-less or sealed cluster stops
              serving /v1/sys/metrics entirely.

    - name: devhub.certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} expires in under 14 days"
            description: "cert-manager has not renewed it — check the Certificate and Order resources."

        - alert: CertificateRenewalFailing
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} is not ready"
            description: "ACME challenge or DNS propagation is failing."

    - name: devhub.gitops
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} out of sync for 30m"
            description: "Auto-sync is enabled, so a persistent drift means sync is erroring."

        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is degraded"

    - name: devhub.backups
      rules:
        - alert: VeleroBackupFailed
          expr: increase(velero_backup_failure_total[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Velero backup failed ({{ $labels.schedule }})"
            description: "Cluster state is no longer being backed up."

        - alert: VeleroNoRecentBackup
          expr: time() - velero_backup_last_successful_timestamp > 172800
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful Velero backup in 48h"

        - alert: VaultSnapshotJobFailed
          expr: kube_job_status_failed{namespace="vault", job_name=~"vault-raft-snapshot.*"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Vault raft snapshot job failed"
            description: "Vault's own storage is not being snapshotted — restore would rely on cloud volume backups only."

        # Failure is not the only way snapshots stop. A suspended, deleted or
        # never-scheduled CronJob produces no failed Jobs at all, so the rule
        # above stays quiet while nothing is being backed up. The schedule is
        # every 6h; 12h without a success is two missed runs.
        - alert: VaultSnapshotStale
          expr: |
            absent(kube_cronjob_status_last_successful_time{namespace="vault", cronjob="vault-raft-snapshot"})
            or time() - kube_cronjob_status_last_successful_time{namespace="vault", cronjob="vault-raft-snapshot"} > 43200
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No successful Vault raft snapshot in 12h"
            description: >-
              The vault-raft-snapshot CronJob has not completed successfully in two
              scheduling windows — check whether it is suspended or has been deleted.

    - name: devhub.platform
      rules:
        - alert: PersistentVolumeFillingUp
          # Joining on (namespace, persistentvolumeclaim), not the claim name
          # alone: PVC names repeat across namespaces (`data`, `storage`), so a
          # one-label join let an app's PVC in devhub-* satisfy the platform
          # filter — and hid a genuinely full platform volume behind it.
          expr: |
            (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.15
            and on(namespace, persistentvolumeclaim) kube_persistentvolumeclaim_labels{namespace=~"vault|monitoring|forgejo|woodpecker|data-services"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is over 85% full"

        - alert: PlatformPodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace=~"vault|keycloak|forgejo|woodpecker|argocd|monitoring|external-secrets|envoy-gateway-system"
            }[30m]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"

        # This was IngressCertificateServedIsSelfSigned, on
        # probe_ssl_earliest_cert_expiry — a blackbox-exporter metric, and there
        # is no blackbox exporter anywhere in this platform, so the rule could
        # never fire. cert-manager's own metrics are the signal actually
        # available: if it holds no Certificate at all, nothing has issued the
        # gateway's TLS secret and Envoy is serving its self-signed fallback.
        #
        # The expiry half of the old intent is already covered, with exactly the
        # expression you would write here, by CertificateExpiringSoon in the
        # devhub.certificates group above — repeating it would only produce two
        # alerts for one condition.
        - alert: GatewayCertificateMissing
          expr: absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "cert-manager holds no certificates — the gateway is serving a self-signed fallback"
            description: >-
              Either cert-manager is not running, its metrics are not being scraped,
              or every Certificate has been deleted. In all three cases nobody would
              notice an expiring listener certificate.
