# Loki Helm values (Single Binary mode for local/small deployments)
# Chart: grafana/loki
# Docs: https://grafana.com/docs/loki/latest/installation/helm/

# Use SingleBinary mode for local development (no object storage required)
deploymentMode: SingleBinary

loki:
  # Multi-tenant. Every writer must send X-Scope-OrgID: the platform cluster's
  # Alloy uses "platform", each workload cluster uses its environment name. With
  # auth_enabled: false the header was ignored and all clusters' logs were mixed
  # into one anonymous tenant.
  auth_enabled: true

  commonConfig:
    replication_factor: 1

  # Retention must be enabled explicitly or Loki keeps chunks forever.
  limits_config:
    retention_period: 720h # 30d
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_series: 10000
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

  storage:
    type: filesystem
  
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Single binary mode for simpler setup
singleBinary:
  replicas: 1
  priorityClassName: platform-critical
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi

# Disable read/write/backend separation (not needed for SingleBinary)
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# Memcached caches: the chart's defaults allocate 8G for the chunks cache
# (~9.8Gi pod request), which no small dev node can schedule — the pod sits
# Pending until helm's --atomic deadline rolls the whole release back.
chunksCache:
  allocatedMemory: 1024
resultsCache:
  allocatedMemory: 512

# The canary is a per-node probe DaemonSet; on small tainted-node clusters it
# leaves permanently-Pending pods and adds nothing a dev platform needs. The
# chart's helm test reads from the canary, so it goes with it.
lokiCanary:
  enabled: false
test:
  enabled: false

# Gateway (nginx)
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Monitoring
monitoring:
  serviceMonitor:
    enabled: true
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# No need for minio in single binary mode
minio:
  enabled: false
