# kube-prometheus-stack Helm values
# Chart: prometheus-community/kube-prometheus-stack
# Docs: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# Domain configuration is provided by overlays:
#   - overlays/local/devops/monitoring/values.yaml
#   - overlays/upcloud/devops/monitoring/values.yaml

# This includes: Prometheus, Alertmanager, Grafana, and various exporters

# Prometheus
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 40GB
    priorityClassName: platform-critical

    # Long-term metrics live outside the cluster. Set remoteWrite in the cloud
    # overlay (Amazon Managed Prometheus, Azure Monitor, GCM, Grafana Cloud) —
    # a 30-day local PVC is not an archive.
    remoteWrite: []

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 60Gi
    
    # Service discovery for all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    
    # Additional scrape configs for external targets
    additionalScrapeConfigs: []

  # Routing is a Gateway API HTTPRoute (overlays/<env>/devops/httproutes.yaml).
  ingress:
    enabled: false

# Alertmanager
alertmanager:
  # Alerts previously had nowhere to go: the stack shipped with the chart's
  # default "null" route, so every firing alert was silently discarded.
  #
  # The Slack webhook is read from a mounted secret (created by deploy.sh, empty
  # by default) so no credential lives in this file. With an empty webhook the
  # config still loads and alerts are visible in the Alertmanager UI.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: platform-slack
      routes:
        # Watchdog proves the alert path itself works end to end.
        - matchers:
            - alertname = "Watchdog"
          receiver: platform-null
          repeat_interval: 1h
        - matchers:
            - severity = "critical"
          receiver: platform-slack
          group_wait: 10s
          repeat_interval: 1h
        - matchers:
            - severity = "warning"
          receiver: platform-slack
    inhibit_rules:
      # A critical alert already says the thing is broken; drop the warning.
      - source_matchers:
            - severity = "critical"
        target_matchers:
            - severity = "warning"
        equal: ['alertname', 'namespace']
    receivers:
      - name: platform-null
      - name: platform-slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: '#platform-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

  alertmanagerSpec:
    priorityClassName: platform-critical

    # Mounted at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  # Routing is a Gateway API HTTPRoute (overlays/<env>/devops/httproutes.yaml).
  ingress:
    enabled: false

# Grafana
grafana:
  priorityClassName: platform-critical
  adminPassword: ""  # Use existingSecret
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 5Gi

  # Routing is a Gateway API HTTPRoute (overlays/<env>/devops/httproutes.yaml).
  ingress:
    enabled: false

  # Keycloak SSO integration - domain overridden by overlays
  grafana.ini:
    server:
      root_url: https://grafana.example.com
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      # client_secret from existingSecret
      scopes: openid email profile
      auth_url: https://keycloak.example.com/realms/devops/protocol/openid-connect/auth
      token_url: https://keycloak.example.com/realms/devops/protocol/openid-connect/token
      api_url: https://keycloak.example.com/realms/devops/protocol/openid-connect/userinfo
      # Keycloak's client scope emits a "groups" claim (realm groups), not
      # "roles" — matching on roles[*] silently made every SSO user a Viewer.
      role_attribute_path: contains(groups[*], 'devops-admins') && 'Admin' || contains(groups[*], 'developers') && 'Editor' || 'Viewer'
      role_attribute_strict: false
      allow_assign_grafana_admin: true

  # Additional data sources (Loki, Tempo)
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local:80
      access: proxy
      isDefault: false
      secureJsonData:
        httpHeaderValue1: platform
      jsonData:
        # Loki runs with auth_enabled: true, so every read needs a tenant.
        httpHeaderName1: X-Scope-OrgID
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: "traceID=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          tags: ['job', 'namespace', 'pod']
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki

# Node exporter for node metrics
nodeExporter:
  enabled: true

# kube-state-metrics
kubeStateMetrics:
  enabled: true

# Prometheus operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
