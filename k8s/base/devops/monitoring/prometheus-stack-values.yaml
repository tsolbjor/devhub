# kube-prometheus-stack Helm values
# Chart: prometheus-community/kube-prometheus-stack
# Docs: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# Domain configuration is provided by overlays:
#   - overlays/local/devops/monitoring/values.yaml
#   - overlays/upcloud/devops/monitoring/values.yaml

# This includes: Prometheus, Alertmanager, Grafana, and various exporters

# Prometheus
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 40GB
    priorityClassName: platform-critical

    # Long-term metrics live outside the cluster. Set remoteWrite in the cloud
    # overlay (Amazon Managed Prometheus, Azure Monitor, GCM, Grafana Cloud) —
    # a 30-day local PVC is not an archive.
    remoteWrite: []

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 60Gi
    
    # Service discovery for all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    
    # Additional scrape configs for external targets
    additionalScrapeConfigs: []

  # Routing is a Gateway API HTTPRoute (base/devops/httproutes.yaml).
  ingress:
    enabled: false

# Alertmanager
alertmanager:
  # Alerts previously had nowhere to go: the stack shipped with the chart's
  # default "null" route, so every firing alert was silently discarded.
  #
  # The Slack webhook is read from a mounted secret (created by deploy.sh, empty
  # by default) so no credential lives in this file. With an empty webhook the
  # config still loads and alerts are visible in the Alertmanager UI.
  #
  # Routing therefore defaults to platform-null — visible everywhere, delivered
  # nowhere. Defaulting to platform-slack was worse than silence: with no webhook
  # set (every environment on its first deploy) the receiver reads an empty
  # api_url_file, fails every notify with `unsupported protocol scheme ""`, and
  # fires AlertmanagerFailedToSendAlerts — a permanent critical alert whose only
  # cause is having nowhere to send alerts. local has shipped the null override
  # for exactly that reason; this is the same choice for every environment.
  #
  # To deliver alerts, do both — ArgoCD renders these files straight from git, so
  # nothing a script substitutes at deploy time survives the handover:
  #   1. vault kv put secret/platform/alertmanager webhook-url=https://hooks.slack.com/...
  #   2. change the three receivers below to platform-slack in the cloud overlay
  #      (k8s/overlays/<cloud>/devops/monitoring/values.yaml)
  # deploy.sh warns whenever those two disagree, in either direction.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: platform-null
      routes:
        # Watchdog is discarded here, and that is worth being honest about: it
        # proves nothing. The alert is generated by Prometheus and routed to a
        # null receiver inside the same Alertmanager, so if Prometheus,
        # Alertmanager or the Slack webhook dies, nobody is told — the failure
        # silences the very thing that would report it.
        #
        # A dead man's switch has to live outside the cluster: point Watchdog at
        # an external check-in URL (healthchecks.io, Better Uptime, Grafana Cloud,
        # PagerDuty heartbeat) that alarms when the pings *stop*. Uncomment the
        # receiver below, add its URL to the alertmanager-slack secret alongside
        # webhook-url, and change this route's receiver to platform-deadmanssnitch.
        - matchers:
            - alertname = "Watchdog"
          receiver: platform-null
          repeat_interval: 1h
        - matchers:
            - severity = "critical"
          receiver: platform-null
          group_wait: 10s
          repeat_interval: 1h
        - matchers:
            - severity = "warning"
          receiver: platform-null
    inhibit_rules:
      # A critical alert already says the thing is broken; drop the warning.
      - source_matchers:
            - severity = "critical"
        target_matchers:
            - severity = "warning"
        equal: ['alertname', 'namespace']
    receivers:
      - name: platform-null
      # The external dead man's switch the Watchdog route above should use. The
      # external service expects a ping at least once per repeat_interval and
      # alarms — through its own channel, not this Alertmanager — when they stop.
      # send_resolved: false because the check-in is the whole message.
      #
      # - name: platform-deadmanssnitch
      #   webhook_configs:
      #     - url_file: /etc/alertmanager/secrets/alertmanager-slack/deadmanssnitch-url
      #       send_resolved: false
      #       max_alerts: 1
      - name: platform-slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: '#platform-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

  alertmanagerSpec:
    priorityClassName: platform-critical

    # Mounted at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  # Routing is a Gateway API HTTPRoute (base/devops/httproutes.yaml).
  ingress:
    enabled: false

# Grafana
grafana:
  priorityClassName: platform-critical
  adminPassword: ""  # Use existingSecret
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 5Gi

  # Routing is a Gateway API HTTPRoute (base/devops/httproutes.yaml).
  ingress:
    enabled: false

  # Keycloak SSO. ${DOMAIN} is substituted by template_values, so this is the
  # whole configuration — every overlay used to repeat it to swap example.com
  # for the real domain, and to make the two corrections now inlined here:
  # "groups" in scopes (without it the claim is absent and role_attribute_path
  # below silently makes every SSO user a Viewer), and in-cluster URLs for the
  # two endpoints Grafana calls itself.
  grafana.ini:
    server:
      root_url: https://grafana.${DOMAIN}
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      # client_secret from envValueFrom below
      scopes: openid email profile groups
      # Browser-facing: the user is redirected here.
      auth_url: https://keycloak.${DOMAIN}/realms/devops/protocol/openid-connect/auth
      # Server-side: Grafana calls these itself, so they must be in-cluster. On
      # local that is not a preference — glibc answers *.localhost in
      # getaddrinfo before /etc/hosts, so an external URL cannot resolve from a
      # pod at all.
      token_url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/devops/protocol/openid-connect/token
      api_url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/devops/protocol/openid-connect/userinfo
      # Keycloak's client scope emits a "groups" claim (realm groups), not
      # "roles" — matching on roles[*] silently made every SSO user a Viewer.
      role_attribute_path: contains(groups[*], 'devops-admins') && 'Admin' || contains(groups[*], 'developers') && 'Editor' || 'Viewer'
      role_attribute_strict: false
      allow_assign_grafana_admin: true

  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc-secret
        key: client-secret

  # Additional data sources (Loki, Tempo)
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local:80
      access: proxy
      isDefault: false
      secureJsonData:
        httpHeaderValue1: platform
      jsonData:
        # Loki runs with auth_enabled: true, so every read needs a tenant.
        httpHeaderName1: X-Scope-OrgID
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: "traceID=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"
    - name: Tempo
      type: tempo
      uid: tempo
      # 3200 is Tempo's HTTP API; 3100 is Loki's. With the wrong port the
      # datasource health check times out and every trace query returns 502.
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          tags: ['job', 'namespace', 'pod']
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki

# Managed control planes (AKS, EKS, GKE, UCS, k3s) expose none of these, so the
# chart's default ServiceMonitors sit permanently down, firing TargetDown against
# components that are not ours to run. Every overlay disabled them identically.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# Node exporter for node metrics
nodeExporter:
  enabled: true

# kube-state-metrics
kubeStateMetrics:
  enabled: true

# Prometheus operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
