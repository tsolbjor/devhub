# Tempo Helm values (Single Binary)
# Chart: grafana/tempo
# Docs: https://grafana.com/docs/tempo/latest/setup/helm-chart/
# Note: grafana/tempo is the single-binary chart; grafana/tempo-distributed is for microservices mode.

tempo:
  repository: grafana/tempo
  tag: "2.9.0"
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Receivers for traces
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Persistence
persistence:
  enabled: true
  size: 10Gi

# Metrics
serviceMonitor:
  enabled: true
