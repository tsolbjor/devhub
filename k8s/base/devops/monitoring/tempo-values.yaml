# Tempo Helm values (Single Binary)
# Chart: grafana/tempo
# Docs: https://grafana.com/docs/tempo/latest/setup/helm-chart/
#
# Upstream marks this chart deprecated in favour of grafana/tempo-distributed, and
# `helm upgrade` says so on every run. It is kept deliberately: tempo-distributed
# runs distributor, ingester, querier, query-frontend and compactor as separate
# deployments — five to six pods for a platform whose trace volume fits in one.
# Migration path when the chart stops receiving Tempo releases: switch to
# tempo-distributed with one replica per component, keep the same S3/Blob/GCS
# bucket and the same OTLP endpoint, so only this file and the chart name change.

tempo:
  repository: grafana/tempo
  tag: "2.9.0"
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Receivers for traces
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Persistence
persistence:
  enabled: true
  size: 10Gi

# Metrics
serviceMonitor:
  enabled: true
