# Headlamp Kubernetes Dashboard
# K8s API access: in-cluster ServiceAccount with view + pod exec/logs + metrics
# UI authentication: OIDC via Keycloak (headlamp-oidc-secret)
replicaCount: 1

# No OIDC in Headlamp itself — deliberately. Headlamp's OIDC mode forwards the
# user's token to the Kubernetes API server, which managed clusters won't
# accept from a custom issuer (AKS trusts Entra only). Authentication happens
# at the gateway instead (oidc-securitypolicy.yaml, same as Homepage/Portal);
# Headlamp reaches the API as its curated read-only ServiceAccount, with the
# long-lived token from `deploy.sh --env <env> headlamp-token` pasted at its
# token screen.
config:
  oidc:
    secret:
      create: false

# The chart's default binds the ServiceAccount to cluster-admin — silently
# overriding the curated read-only ClusterRole in rbac.yaml (delete pods,
# read Secrets, everything). rbac.yaml's headlamp-view binding is the only
# access this account gets.
clusterRoleBinding:
  create: false

# The headlamp namespace enforces the "restricted" Pod Security Standard, and the
# chart's defaults do not meet it (no seccompProfile, no dropped capabilities, no
# explicit allowPrivilegeEscalation) — pods would be rejected at admission.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: headlamp

# Routing is a Gateway API HTTPRoute (base/devops/httproutes.yaml)
ingress:
  enabled: false

resources:
  requests:
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
