# Headlamp Kubernetes Dashboard
# K8s API access: in-cluster ServiceAccount with view + pod exec/logs + metrics
# UI authentication: OIDC via Keycloak (headlamp-oidc-secret)
replicaCount: 1

config:
  oidc:
    # Secret created by deploy.sh (placeholder) then updated by setup-keycloak.sh (real values)
    # Keys: clientID, clientSecret, issuerURL, scopes
    secret:
      name: headlamp-oidc-secret
      create: false

# The headlamp namespace enforces the "restricted" Pod Security Standard, and the
# chart's defaults do not meet it (no seccompProfile, no dropped capabilities, no
# explicit allowPrivilegeEscalation) — pods would be rejected at admission.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: headlamp

# Routing is a Gateway API HTTPRoute (overlays/<env>/devops/httproutes.yaml)
ingress:
  enabled: false

resources:
  requests:
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
