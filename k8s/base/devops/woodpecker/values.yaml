# Woodpecker CI — pipelines for repositories hosted in Forgejo.
# Chart: woodpecker/woodpecker
#
# Why this and not Forgejo Actions: Woodpecker's Kubernetes backend runs every
# pipeline step as an ordinary pod. Actions' runner is built around Docker, which
# on Kubernetes means a privileged daemon — the exact thing the platform removed.
#
# Job pods land in the woodpecker-ci namespace, where a NetworkPolicy blocks the
# cloud metadata endpoint and all RFC1918 ranges, and a Kyverno mutation pins them
# to the tainted CI node pool. Image builds use rootless BuildKit.
#
# Note the chart's shape: the server is a StatefulSet (it owns a volume), the agent
# a Deployment — hence server.statefulSet.replicaCount but agent.replicaCount.

server:
  enabled: true

  statefulSet:
    replicaCount: 1
    annotations:
      # Restart when the Forgejo OAuth credentials or agent secret change.
      reloader.stakater.com/auto: "true"

  # Forgejo is Gitea-API compatible, so the Gitea integration is the correct one.
  env:
    # Open registration: with WOODPECKER_OPEN=false and no admin list, the
    # first login dies on "registration is closed" — nobody can ever get in.
    # Open is safe here: Forgejo has no self-registration (accounts only come
    # from Keycloak SSO), so Keycloak bounds who can reach Woodpecker at all.
    WOODPECKER_OPEN: "true"
    WOODPECKER_ADMIN: "platform-admin,devhub-admin"
    WOODPECKER_GITEA: "true"
    WOODPECKER_AUTHENTICATE_PUBLIC_REPOS: "true"
    WOODPECKER_LOG_LEVEL: info
    WOODPECKER_HOST: https://ci.${DOMAIN}
    # Server-side calls stay in-cluster: *.localhost resolves to 127.0.0.1 inside
    # the container, so the public URL is browser-facing only. Without the split
    # the OAuth code exchange dies on
    #   Post "https://git.localhost/login/oauth/access_token": dial tcp 127.0.0.1:443
    # and every Woodpecker sign-in fails with "Error while authenticating against
    # OAuth provider".
    #
    # forge-url is what the server calls; EXPERT_FORGE_OAUTH_HOST is the URL the
    # browser is redirected to. Off local the two are equal.
    WOODPECKER_GITEA_URL: ${FORGEJO_URL_INTERNAL}
    WOODPECKER_EXPERT_FORGE_OAUTH_HOST: https://git.${DOMAIN}
    # Same problem in the other direction: Forgejo's webhooks are called from the
    # Forgejo pod, which cannot resolve ci.${DOMAIN} on local either.
    WOODPECKER_EXPERT_WEBHOOK_HOST: ${WOODPECKER_URL_INTERNAL}
    WOODPECKER_GITEA_SKIP_VERIFY: "false"
    # The address pipeline steps use to reach Forgejo, injected into every step
    # of every pipeline as $FORGEJO_URL.
    #
    # Pipelines cannot use git.${DOMAIN}. The clone step, the chart download and
    # the deploy push all run as pods in woodpecker-ci, where that name is
    # 127.0.0.1 on local — and where the ci-egress NetworkPolicy blocks every
    # RFC1918 destination on purpose, so the gateway is out of reach even when
    # the name does resolve (a cloud environment fronted by an internal load
    # balancer has the same problem). What the policy *does* allow is the forgejo
    # namespace directly, which is the path this address takes.
    #
    # It is supplied by the platform rather than substituted into each
    # repository, so a scaffolded repository carries no environment-specific URL
    # and stays portable between environments.
    WOODPECKER_ENVIRONMENT: "FORGEJO_URL:${FORGEJO_URL_INTERNAL}"

  # Client id/secret for the Forgejo OAuth application, plus the shared agent
  # secret. Created by deploy.sh; the OAuth half is registered against Forgejo's
  # API by `deploy.sh <env> woodpecker-oauth`.
  extraSecretNamesForEnvFrom:
    - woodpecker-server-secret

  # The chart can mint the agent secret itself, but the platform creates it so the
  # same value can be handed to the agent and stored in Vault.
  createAgentSecret: false

  persistentVolume:
    enabled: true
    size: 8Gi

  ingress:
    enabled: false # Gateway API HTTPRoute instead

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # The upstream image has no USER directive, so an explicit uid is required —
  # runAsNonRoot alone makes the kubelet refuse to start the container. fsGroup
  # gives that uid write access to the state volume.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false # SQLite/queue state lives on the volume
    capabilities:
      drop:
        - ALL

agent:
  enabled: true
  replicaCount: 2

  env:
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker-ci
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_BACKEND_K8S_POD_LABELS: '{"devhub.io/workload":"ci"}'
    WOODPECKER_MAX_WORKFLOWS: "2"

  # The chart always mounts woodpecker-default-agent-secret into the agent, even
  # with createAgentSecret: false — so deploy.sh creates a secret by that name
  # rather than the chart minting one the platform cannot also give to Vault.

  serviceAccount:
    create: true
    # The chart renders the Role/RoleBinding for WOODPECKER_BACKEND_K8S_NAMESPACE,
    # so the agent can drive job pods in woodpecker-ci and nowhere else.
    rbac:
      create: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
