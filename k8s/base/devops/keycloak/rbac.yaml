# RBAC for Keycloak JGroups KUBE_PING discovery (required for --cache-stack=kubernetes)
# Keycloak uses KUBE_PING to discover other pods in the cluster when running in HA mode.
# This grants the keycloak service account permission to list pods in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-pod-reader
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-pod-reader
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-pod-reader
subjects:
  - kind: ServiceAccount
    name: keycloak
    namespace: keycloak
