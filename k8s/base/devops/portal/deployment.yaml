# Portal — a wizard that turns "I need a new service" into a Forgejo repository
# the platform already knows how to build, publish and run.
#
# It is deliberately thin. Everything heavy already exists as convention:
#   repo appears in the devhub org  → forgejo-appset deploys it to every
#                                     registered workload cluster
#   repo contains .woodpecker.yml   → Woodpecker builds it once activated
#   namespace devhub-<app> appears  → Kyverno generates quota, limits and
#                                     NetworkPolicies
# So the portal's whole job is a handful of Forgejo API calls: copy the
# template repository, substitute APP_NAME/DOMAIN, create starter issues.
#
# One design rule: the portal writes git, never the cluster. It holds one
# Forgejo token and no Kubernetes RBAC at all — every provision it makes is a
# commit ArgoCD reconciles, auditable in git history and covered by the push
# mirror. The token belongs to a dedicated bot user (`devhub-bot`): not a site
# admin, just an owner-team member of the devhub org with can_create_org_repo,
# so the blast radius of a leaked token is the org's repos — never Forgejo
# user administration or other orgs. Scaffolds and add-ons show up in history
# as devhub-bot, distinct from any human account.
#
# Authentication is the gateway's job, exactly as for Homepage: the OIDC
# SecurityPolicy in this directory runs the Keycloak flow in front of the
# HTTPRoute, and the NetworkPolicy only admits the gateway, so the pod never
# sees an anonymous request.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal
  labels:
    app: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      serviceAccountName: portal
      automountServiceAccountToken: false
      priorityClassName: platform-standard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          # Stock runtime image; the application is the mounted ConfigMap. Node
          # because it needs exactly one capability beyond serving HTTP: calling
          # the Forgejo JSON API, which global fetch covers without dependencies.
          image: docker.io/library/node:22-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DOMAIN
              value: "${DOMAIN}"
            # In-cluster Forgejo API endpoint. Never the public hostname: on
            # local, glibc resolves *.localhost to the pod's own loopback.
            - name: FORGEJO_URL
              value: "http://forgejo-http.forgejo.svc.cluster.local:3000"
            - name: APPS_ORG
              value: "devhub"
            # Templates live in their own org: forgejo-appset deploys every
            # devhub-org repo with a k8s/ directory, and a template repo must
            # never itself land on a workload cluster.
            - name: TEMPLATES_ORG
              value: "devhub-templates"
            # Keycloak's JWKS, so the portal verifies the RS256 signature of
            # the gateway-forwarded access token (defense in depth on top of
            # the SecurityPolicy + NetworkPolicy perimeter). In-cluster URL,
            # same reason as FORGEJO_URL. Unset = perimeter trust only, with a
            # startup warning.
            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/devops/protocol/openid-connect/certs"
            # Keycloak groups whose members may provision (create apps, enable
            # add-ons). Everyone the gateway signs in can still browse.
            - name: PROVISION_GROUPS
              value: "developers,devops-admins"
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portal-forgejo-token
                  key: token
            # Which account that token belongs to. The portal's token scopes
            # cannot read /user back, so `deploy.sh <env> portal-token` records
            # the name alongside the token; the portal uses it only in log and
            # error messages ("devhub-bot is not admin on that repo"). Optional:
            # a secret minted before the bot existed has no username key, and
            # the code falls back to "devhub-bot".
            - name: FORGEJO_BOT_USER
              valueFrom:
                secretKeyRef:
                  name: portal-forgejo-token
                  key: username
                  optional: true
            # Woodpecker, for activating scaffolded repos at creation time.
            # Optional: Woodpecker only mints user tokens in its UI, so this
            # secret exists once someone ran `deploy.sh <env> ci-secrets`.
            # Without it the wizard still works and leaves activation as a
            # starter issue.
            - name: WOODPECKER_URL
              value: "http://woodpecker-server.woodpecker.svc.cluster.local"
            - name: WOODPECKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portal-woodpecker-token
                  key: token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: portal-app
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: portal
  labels:
    app: portal
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
