# ClusterSecretStore: workload cluster → platform Vault.
#
# Authentication uses Vault's JWT auth backend against this cluster's own OIDC
# issuer: the External Secrets Operator presents its projected ServiceAccount
# token, Vault verifies it against the cluster's public JWKS, and issues a
# short-lived token scoped to a narrow policy.
#
# The previous design used a static, never-rotated Vault token (`-ttl=0
# -period=24h`) stored as a plain Secret. Anyone who read that Secret held
# indefinite access to the platform's secret store.
#
# register-workload-cluster.sh creates the matching Vault auth mount and role.
# Templated with ${PLATFORM_VAULT_URL} and ${ENV}.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "${PLATFORM_VAULT_URL}"
      path: "secret"
      version: "v2"
      auth:
        jwt:
          path: "jwt-${ENV}"
          role: "workload-${ENV}"
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences:
              - vault
            expirationSeconds: 600
