# devhub-app chart defaults. An app repository overrides only what it must:
# app.name, app.host, app.image.repository, registry.host — everything else is
# a platform opinion it can inherit.

app:
  # Required. Also the Service name, the Secret prefix and the default label set.
  name: ""
  # Required. Public hostname the HTTPRoute claims on the platform gateway.
  host: ""
  # Additional hostnames served by the same app. One label per name — the
  # platform's wildcard certificate and apps listener cover *.<domain> exactly
  # one label deep, so the ecosystem convention is suffix grouping:
  #   host:       citest.<domain>          the landing page
  #   extraHosts: [api-citest.<domain>]    siblings of the same app
  # A separate deployable (own image, own lifecycle) is its own portal scaffold
  # named api-<app> instead.
  #
  # Note on auth: the OIDC flow's callback is registered on app.host, so with
  # auth.enabled the sign-in works there; extraHosts are best kept for
  # unauthenticated surfaces (a public API) or handled by the app itself.
  extraHosts: []
  # Container port the app listens on. The Service exposes it as port 80;
  # TLS (443) terminates at the gateway, never in the app.
  port: 8080
  replicas: 2
  image:
    # Required, e.g. git.example.com/devhub/my-app
    repository: ""
    # CI rewrites this to the commit SHA on every push to the default branch.
    tag: latest
  # Extra environment variables, verbatim container env entries.
  env: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  probes:
    liveness: /healthz
    readiness: /readyz

registry:
  # Required. Registry hostname the pull secret authenticates against,
  # e.g. git.example.com (Forgejo's container registry).
  host: ""

# The platform gateway the HTTPRoute attaches to. Defaults match every devhub
# environment; only a non-standard gateway needs overrides.
gateway:
  name: devhub
  namespace: gateway
  section: apps

# Sign-in at the gateway, via the platform Keycloak. The app itself stays
# auth-unaware: Envoy Gateway runs the whole OIDC code flow and only forwards
# authenticated requests.
#
#   enabled: true   → the whole app requires sign-in; exceptPaths stay public
#                     (health endpoints, webhooks, a public API)
#   enabled: false  → the app is public; exceptPaths require sign-in
#                     (an /admin section)
#
# The client secret arrives via External Secrets from the platform Vault
# (secret/apps/oidc-gateway, seeded by setup-vault.sh; the "apps" client is
# created by setup-keycloak.sh with a wildcard redirect for *.<domain>).
auth:
  enabled: false
  exceptPaths: []
  # Required when auth or mcp is in use, e.g. https://keycloak.example.com/realms/devops
  issuer: ""
  clientID: apps
  # Where Envoy fetches tokens. Defaults to <issuer>/protocol/openid-connect/token;
  # override with an in-cluster Keycloak URL where the public one is unreachable
  # from the gateway (local environments).
  tokenEndpoint: ""

# Token-protected Model Context Protocol endpoint at mcp.path. Where auth: is
# browser sign-in (OIDC code flow, cookies), MCP clients (Claude Code, VS Code)
# present Bearer JWTs: the gateway validates them against the platform Keycloak
# (issuer + audience) and serves the RFC 9728 discovery document
# (/.well-known/oauth-protected-resource) that tells clients where and how to
# sign in — including offline_access, so the connection outlives Keycloak's SSO
# session cap. The app stays auth-unaware on this path too: it just handles
# validated /mcp requests, reading the forwarded JWT for identity if it cares.
#
# Independent of auth.enabled: the mcp.path route always carries JWT
# validation, never the browser flow, and the discovery document stays public.
# The realm side (mcp scope, audience, CIMD client policy) is one-time
# platform prep: `setup-keycloak.sh mcp`.
mcp:
  enabled: false
  path: /mcp
  # Audience the access token must carry — stamped by the platform's optional
  # `mcp` client scope. Shared across apps, like the `apps` browser client; a
  # per-app audience needs its own client scope + audience mapper in Keycloak.
  audience: mcp
  # Scopes advertised to MCP clients (RFC 9728 scopes_supported).
  scopes: [mcp, offline_access]
  # Where Envoy fetches Keycloak's signing keys. Defaults to
  # <auth.issuer>/protocol/openid-connect/certs; override with an in-cluster
  # URL where the public hostname is unreachable from the gateway (local
  # environments) — the same story as auth.tokenEndpoint.
  jwksEndpoint: ""

# Dev-grade PostgreSQL in the app's namespace. When enabled the app container
# gets POSTGRES_HOST/PORT/DB/USER/PASSWORD env vars automatically and the
# password is generated in-cluster by External Secrets, so nothing is committed.
#
# READ THIS BEFORE PUTTING ANYTHING YOU CARE ABOUT IN IT. "Dev-grade" is not
# modesty, it is the specification:
#   * one replica, one PersistentVolumeClaim — no replication, no failover.
#     While the pod reschedules, the database is simply down
#   * NO BACKUPS. Velero backs up the *platform* cluster; workload-cluster app
#     volumes are not in a backup schedule. There is no PITR and no snapshot
#     to roll back to — a dropped table is gone
#   * the volume is ReadWriteOnce and node-local on some clouds: losing the
#     node can lose the data outright
#   * `helm uninstall` / deprovisioning the app deletes the PVC with it
#   * no tuning, no connection pooling, no monitoring of its own
# It exists so a developer can build a feature on day one without filing a
# ticket. Production data belongs on the managed PostgreSQL the platform
# provisions per cloud (RDS / Cloud SQL / Flexible Server / UpCloud Managed PG),
# which has PITR, snapshots and failover. That move is a manual step — nothing
# here migrates for you, and the portal's starter issue says so.
postgres:
  enabled: false
  storage: 1Gi

# Dev-grade Redis in the app's namespace: cache only. When enabled the app
# container gets REDIS_HOST/REDIS_PORT/REDIS_PASSWORD automatically.
#
# Same dev-grade contract as postgres above, and then some: one replica, no
# persistence at all (an empty cache after every restart), no backups, no
# failover. Treat it strictly as a cache — anything that must survive a pod
# restart does not belong here. Sessions, queues and anything durable belong on
# the managed cache the platform provisions per cloud.
redis:
  enabled: false

# Opt-in horizontal autoscaling. Disabled by default, and while disabled the
# Deployment carries app.replicas exactly as before.
#
# When enabled, the Deployment stops declaring `replicas` at all and the HPA
# owns the count — otherwise ArgoCD would reset it to app.replicas on every
# sync and fight the autoscaler. Requires metrics-server in the workload
# cluster (present on every devhub cluster) and, because scaling is measured as
# a percentage of the CPU *request*, sane app.resources.requests.cpu.
#
# Keep maxReplicas inside the namespace ResourceQuota Kyverno generates
# (4 CPU / 8 GiB of requests): maxReplicas × requests must fit, or the HPA will
# scale up into failed pods.
#
# autoscaling:
#   enabled: true
#   minReplicas: 2
#   maxReplicas: 6
#   targetCPUUtilizationPercentage: 70
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Opt-in init containers, rendered verbatim into the app's pod spec. This is
# the chart's database-migration hook: an init container runs to completion
# before the app container starts, on every pod, so a rollout applies the
# schema change before the new code serves traffic.
#
# Notes that will bite otherwise:
#   * they inherit the pod securityContext (non-root, uid 10001) and Kyverno
#     validates them like any other container — CPU and memory requests AND
#     limits are mandatory, no privileged, allow-listed registry only
#   * readOnlyRootFilesystem is set per container: add your own emptyDir if the
#     migration tool needs to write
#   * this runs once per pod, and concurrently across pods during a rollout —
#     the migration must be idempotent and safe to run twice at once (most
#     migration tools take a lock; confirm yours does)
#   * migrations must be backward compatible with the *previous* image, which
#     is still serving while the new pods roll out
#   * postgres.enabled connection env vars are NOT injected here — repeat the
#     secretKeyRefs you need (secret <app>-postgres, keys database/username/
#     password) as shown below
#
# initContainers:
#   - name: migrate
#     image: git.example.com/devhub/my-app:latest   # usually the app image
#     command: ["/app/migrate"]
#     env:
#       - name: POSTGRES_HOST
#         value: my-app-postgres
#       - name: POSTGRES_DB
#         valueFrom: { secretKeyRef: { name: my-app-postgres, key: database } }
#       - name: POSTGRES_USER
#         valueFrom: { secretKeyRef: { name: my-app-postgres, key: username } }
#       - name: POSTGRES_PASSWORD
#         valueFrom: { secretKeyRef: { name: my-app-postgres, key: password } }
#     securityContext:
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: true
#       capabilities: { drop: ["ALL"] }
#     resources:
#       requests: { cpu: 50m, memory: 64Mi }
#       limits: { cpu: 500m, memory: 256Mi }
initContainers: []

# Off-the-shelf containers running beside the app — the dev-grade
# postgres/redis pattern, generalised. No CI: the image comes from any
# Kyverno-allow-listed registry (git.<domain>, ghcr.io, docker.io/library,
# registry.k8s.io, quay.io) with its tag pinned here; Renovate can bump it.
# Each entry gets the same hardened treatment as the app: non-root, no
# capabilities, resource limits, workload-default priority.
#
# extraWorkloads:
#   - name: docs                        # objects are named <app>-<name>
#     image: ghcr.io/some-org/docs:1.4.2
#     port: 8080
#     host: docs-myapp.example.com      # optional — omit for in-cluster only
#     replicas: 1                       # optional
#     env: []                           # optional, verbatim container env
#     resources: {}                     # optional, defaults are conservative
#     runAsUser: 10001                  # optional — public images often need
#                                       # their own uid; root stays forbidden
#     writableDirs: []                  # optional emptyDir mounts for images
#                                       # that write, e.g. [/tmp, /var/cache]
#     probePath: ""                     # optional HTTP readiness path;
#                                       # default is a TCP check on port
#     auth: false                       # true → Keycloak sign-in at the
#                                       # gateway for this host (needs the
#                                       # top-level auth.issuer set)
extraWorkloads: []

# Escape hatch: additional manifests rendered verbatim, for the one thing the
# chart does not model. If this list grows, eject to raw k8s/ manifests instead
# (delete values.yaml, commit manifests — the raw ApplicationSet takes over).
extraManifests: []
