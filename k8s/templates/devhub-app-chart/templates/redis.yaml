# Opt-in dev-grade Redis: a cache, so no persistence — an emptyDir that
# vanishes with the pod is the honest behaviour. The password is generated
# in-cluster by External Secrets' Password generator; the app container gets
# REDIS_HOST/PORT/PASSWORD injected by the chart (deployment.yaml). Production
# caching belongs on the managed Redis/Valkey the platform provisions.
{{- if .Values.redis.enabled }}
{{- $name := include "devhub-app.name" . }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}-redis-password
spec:
  length: 32
  digits: 8
  # No symbols: redis-cli and URL-style REDIS_URLs both choke on them.
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-redis
spec:
  # "0" = generate once; a refresh would rotate the password under the running
  # server, which reads it only at start.
  refreshInterval: "0"
  target:
    name: {{ $name }}-redis
    creationPolicy: Owner
    template:
      data:
        password: "{{ "{{ .password }}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}-redis-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-redis
  labels:
    app: {{ $name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}-redis
  template:
    metadata:
      labels:
        app: {{ $name }}-redis
    spec:
      priorityClassName: workload-default
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $name }}-redis, key: password }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-redis
spec:
  selector:
    app: {{ $name }}-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
