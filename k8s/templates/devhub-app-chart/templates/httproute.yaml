# Public route: attaches to the platform Gateway, which owns TLS and the
# wildcard apps listener. Ports 80/443 are the gateway's business — the app
# only states its hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "devhub-app.name" . }}
  labels:
    {{- include "devhub-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.section }}
  hostnames:
    - {{ required "app.host is required" .Values.app.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "devhub-app.name" . }}
          port: 80
