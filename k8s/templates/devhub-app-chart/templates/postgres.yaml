# Opt-in dev-grade PostgreSQL: one instance, one volume, in the app's own
# namespace. The password is generated in-cluster by External Secrets' Password
# generator, so nothing secret is ever committed. The app container gets
# POSTGRES_HOST/PORT/DB/USER/PASSWORD injected by the chart (deployment.yaml).
# Production loads belong on the managed PostgreSQL the platform provisions.
#
# Image is docker.io/library/* on purpose: Kyverno's registry allow-list for
# devhub-* namespaces admits the platform registry and a short public list.
{{- if .Values.postgres.enabled }}
{{- $name := include "devhub-app.name" . }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}-postgres-password
spec:
  length: 32
  digits: 8
  # No symbols: they end up percent-encoded (or broken) in connection strings.
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-postgres
spec:
  # "0" = generate once and stop: a refresh would mint a new password under a
  # database initialised with the old one.
  refreshInterval: "0"
  target:
    name: {{ $name }}-postgres
    creationPolicy: Owner
    template:
      data:
        username: {{ $name }}
        database: {{ $name }}
        password: "{{ "{{ .password }}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}-postgres-password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-postgres
  labels:
    app: {{ $name }}-postgres
spec:
  serviceName: {{ $name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}-postgres
  template:
    metadata:
      labels:
        app: {{ $name }}-postgres
    spec:
      priorityClassName: workload-default
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: {{ $name }}-postgres, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $name }}-postgres, key: password }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: {{ $name }}-postgres, key: database }
            # A subdirectory, because the volume root holds lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $name }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
          # Restart a wedged server — but deliberately far more patient than
          # readiness. initdb on a fresh volume, or WAL replay after an unclean
          # shutdown, can hold the socket closed for a while, and a liveness
          # kill mid-recovery is how a dev database turns into a corrupt one.
          # Readiness is what keeps traffic away in the meantime.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $name }}"]
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-postgres
spec:
  selector:
    app: {{ $name }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
