apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devhub-app.name" . }}
  labels:
    {{- include "devhub-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ include "devhub-app.name" . }}
  template:
    metadata:
      labels:
        {{- include "devhub-app.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: registry-pull-secret
      # Developer workloads never outrank platform services.
      priorityClassName: workload-default
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "devhub-app.name" . }}
          image: "{{ required "app.image.repository is required" .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.app.port }}
          {{- if or .Values.postgres.enabled .Values.redis.enabled .Values.app.env }}
          env:
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_HOST
              value: {{ include "devhub-app.name" . }}-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "devhub-app.name" . }}-postgres
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "devhub-app.name" . }}-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devhub-app.name" . }}-postgres
                  key: password
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_HOST
              value: {{ include "devhub-app.name" . }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devhub-app.name" . }}-redis
                  key: password
            {{- end }}
            {{- with .Values.app.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.probes.liveness }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.app.probes.readiness }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          # readOnlyRootFilesystem needs writable scratch space for the runtime.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
