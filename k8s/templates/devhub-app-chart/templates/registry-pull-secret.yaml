# ExternalSecret: pulls Forgejo registry credentials from Vault and creates a
# docker-registry secret in this namespace. Requires:
#   - External Secrets Operator on the workload cluster
#   - ClusterSecretStore 'vault-backend' pointing at the platform Vault
#   - Vault path secret/forgejo/registry-pull-token (username, token)
# Both are set up by register-workload-cluster.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull-secret
  labels:
    {{- include "devhub-app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: registry-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ required "registry.host is required" .Values.registry.host }}": {
                "username": "{{ "{{ .username }}" }}",
                "password": "{{ "{{ .token }}" }}",
                "auth": "{{ "{{ printf \"%s:%s\" .username .token | b64enc }}" }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: forgejo/registry-pull-token
        property: username
    - secretKey: token
      remoteRef:
        key: forgejo/registry-pull-token
        property: token
