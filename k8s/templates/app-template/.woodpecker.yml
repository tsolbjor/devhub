# Woodpecker CI pipeline — App Template
#
# Every step runs as an unprivileged pod on the tainted CI node pool (Kyverno adds
# the nodeSelector and toleration). No Docker daemon, no privileged container:
# images are built with rootless BuildKit and pushed to Forgejo's registry.
#
# Secrets used: registry_user, registry_token — provided as Woodpecker *org*
# secrets on the devhub org (`deploy.sh <env> ci-secrets`), scoped to push
# events so pull-request builds from untrusted code cannot read them. Nothing
# to add per repository; a missing secret means ci-secrets has not been run.
#
# CREDENTIAL MAP — registry_token is not a read-only registry key. It is a
# Forgejo access token with repo write, and this pipeline uses it as three
# different things: registry password, chart-download credential, and the git
# push credential for the deploy step. So it is requested per step, never
# pipeline-wide, and only where a step cannot work without it:
#
#   lint    yes — Forgejo runs with REQUIRE_SIGNIN_VIEW, so even the public
#                 devhub-app-chart archive needs a token to download
#   test    NO  — deliberately. Test code pulls third-party packages and runs
#                 arbitrary code from them; it gets no credential to exfiltrate
#   build   yes — registry push (+ registry_user)
#   deploy  yes — pushes the tag-bump commit back to this repo
#
# The org secrets are themselves scoped to push events, so a pull-request
# pipeline running untrusted code gets nothing regardless of what a step asks
# for — lint and deploy additionally decline to run at all on a PR, and build
# runs with PUSH=false.
#
# If you add a step, do not add the token to it "for symmetry". Ask whether the
# step would fail without it.

when:
  - event: [push, pull_request]

# Clone from the in-cluster address instead of the repository's public clone
# URL. Woodpecker takes that URL from Forgejo, which reports its public
# ROOT_URL — and the clone runs in woodpecker-ci, where that host is 127.0.0.1
# on local and blocked by the ci-egress RFC1918 rule anywhere else. Left alone,
# every pipeline died on its first step with
#   fatal: unable to access 'https://git.<domain>/...': Failed to connect
# and no step after clone ever ran.
#
# attempts/backoff are not belt-and-braces either. Every step is a fresh pod, and
# the NetworkPolicy that lets woodpecker-ci reach forgejo is matched on the
# source pod's IP — which the policy controller adds a second or two after the
# pod starts. The clone is the first thing that pod does, so its first
# connection is reliably refused ("Failed to connect ... after 17 ms") while the
# second succeeds. One retry is enough; five is free.
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.2
    settings:
      remote: ${FORGEJO_URL}/devhub/APP_NAME.git
      attempts: 5
      backoff: 3s

steps:
  # Render k8s/values.yaml through the platform's devhub-app chart: a broken
  # values file fails here, before anything reaches ArgoCD. The chart comes from
  # Forgejo's archive endpoint (no git needed).
  #
  # $FORGEJO_URL, not git.DOMAIN: pipeline steps run in woodpecker-ci, where the
  # public hostname is unreachable — 127.0.0.1 on local, and behind the
  # RFC1918 block the ci-egress policy applies everywhere. The platform injects
  # the address that works (WOODPECKER_ENVIRONMENT in the Woodpecker values), so
  # nothing environment-specific is written into this repository.
  #
  # Push events only: Forgejo requires sign-in for every view, so the download
  # authenticates with the registry_token secret — which is deliberately absent
  # from pull-request builds (untrusted code must not read it). This step only
  # needs to *read* a public chart; it holds a write-scoped token because that
  # is the only credential the platform hands to CI today.
  - name: lint
    image: alpine/helm:3.16.2
    when:
      - event: push
    environment:
      FORGEJO_TOKEN:
        from_secret: registry_token
    commands:
      # Quoted for YAML: the colon-space in the header would otherwise parse
      # as a mapping and break the whole pipeline file.
      - 'wget -qO- --header "Authorization: token $FORGEJO_TOKEN" $FORGEJO_URL/devhub-templates/devhub-app-chart/archive/main.tar.gz | tar xz'
      - helm template APP_NAME devhub-app-chart -f k8s/values.yaml >/dev/null
      - echo "values.yaml renders cleanly"

  # No `environment:` block on purpose — see the credential map at the top. Tests
  # restore third-party NuGet packages and execute their code; there is nothing
  # here for that code to steal.
  - name: test
    image: mcr.microsoft.com/dotnet/sdk:8.0
    commands:
      - dotnet test --logger "console;verbosity=normal"

  # Pull requests build but never push: untrusted code must not be able to
  # publish a tag other people might pull.
  - name: build
    image: moby/buildkit:v0.17.2-rootless
    # Rootless BuildKit builds in its own user+mount namespaces; the node's
    # default AppArmor profile denies the mount-propagation call rootlesskit
    # makes ("failed to share mount point: /"). This one step therefore runs
    # with AppArmor/seccomp unconfined — still unprivileged: no host mounts,
    # no added capabilities, no privileged flag.
    backend_options:
      kubernetes:
        securityContext:
          seccompProfile:
            type: Unconfined
          apparmorProfile:
            type: Unconfined
    environment:
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - mkdir -p ~/.docker
      - |
        cat > ~/.docker/config.json <<EOF
        {"auths":{"git.DOMAIN":{"username":"$REGISTRY_USER","password":"$REGISTRY_TOKEN"}}}
        EOF
      # The two tags are not two ways to deploy. `:$CI_COMMIT_SHA` is the
      # deployable artefact — immutable, and the only tag that ever reaches
      # k8s/values.yaml (the deploy step below writes it there). `:latest` is a
      # BuildKit cache pointer and nothing else: --import-cache reads the
      # previous build's inline cache from it, --export-cache writes this
      # build's back, which is why it is still pushed. Never deploy `:latest` —
      # it is mutable, so two clusters could pull different images under the
      # same name and a rollback would have nothing to roll back to.
      - |
        PUSH=false
        if [ "$CI_PIPELINE_EVENT" = "push" ]; then PUSH=true; fi
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --import-cache type=registry,ref=git.DOMAIN/devhub/APP_NAME:latest \
          --export-cache type=inline \
          --output type=image,\"name=git.DOMAIN/devhub/APP_NAME:$CI_COMMIT_SHA,git.DOMAIN/devhub/APP_NAME:latest\",push=$PUSH

  # ArgoCD watches k8s/ and syncs whatever image tag is committed there, so
  # "deploy" is a commit: rewrite app.image.tag to this build's SHA and push it.
  # The deployed version is therefore always readable in git history — and
  # ROLLBACK IS `git revert` of the tag-bump commit (or an edit of
  # k8s/values.yaml to an older SHA). Those images are immutable and still in
  # the registry; no CI re-run is needed to go back.
  #
  # `[skip ci]` in the commit message is LOAD-BEARING, not tidiness: this push
  # is a push to the default branch, which is exactly what triggers this
  # pipeline. Without the marker the build would trigger itself forever. Keep it
  # if you touch the message, and keep the `git diff --cached --quiet` guard —
  # it is the second brake, stopping the commit when the tag has not changed.
  #
  # GIT_TOKEN is registry_token again (see the credential map at the top): the
  # same Forgejo token, used here for its repo-write scope.
  - name: deploy
    image: alpine/git:latest
    environment:
      GIT_TOKEN:
        from_secret: registry_token
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
    commands:
      - git config user.email "ci@git.DOMAIN"
      - git config user.name "Woodpecker CI"
      # Quoted for YAML: the colon-space inside the sed pattern would otherwise
      # be parsed as a mapping and break the whole pipeline file.
      - 'sed -i "s|tag: .*|tag: $CI_COMMIT_SHA|" k8s/values.yaml'
      - git add k8s/values.yaml
      - git diff --cached --quiet && echo "no image change" && exit 0
      - git commit -m "[skip ci] deploy $CI_COMMIT_SHA"
      # origin has no credentials in a step container. The token goes in an
      # Authorization header rather than in the URL: a credential embedded in a
      # remote URL is echoed back by git in error messages and ends up in the
      # pipeline log. $FORGEJO_URL is the in-cluster address (see the lint step).
      - 'git -c http.extraHeader="Authorization: token $GIT_TOKEN" push "$FORGEJO_URL/devhub/APP_NAME.git" HEAD:${CI_REPO_DEFAULT_BRANCH}'
