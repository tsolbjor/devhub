# Woodpecker CI pipeline — App Template
#
# Every step runs as an unprivileged pod on the tainted CI node pool (Kyverno adds
# the nodeSelector and toleration). No Docker daemon, no privileged container:
# images are built with rootless BuildKit and pushed to Forgejo's registry.
#
# Secrets used: registry_user, registry_token — provided as Woodpecker *org*
# secrets on the devhub org (`deploy.sh <env> ci-secrets`), scoped to push
# events so pull-request builds from untrusted code cannot read them. Nothing
# to add per repository; a missing secret means ci-secrets has not been run.

when:
  - event: [push, pull_request]

steps:
  # Render k8s/values.yaml through the platform's devhub-app chart: a broken
  # values file fails here, before anything reaches ArgoCD. The chart comes from
  # Forgejo's archive endpoint (no git needed); --no-check-certificate because
  # local environments run a private CA the CI image does not trust.
  #
  # Push events only: Forgejo requires sign-in for every view, so the download
  # authenticates with the registry_token secret — which is deliberately absent
  # from pull-request builds (untrusted code must not read it).
  - name: lint
    image: alpine/helm:3.16.2
    when:
      - event: push
    environment:
      FORGEJO_TOKEN:
        from_secret: registry_token
    commands:
      # Quoted for YAML: the colon-space in the header would otherwise parse
      # as a mapping and break the whole pipeline file.
      - 'wget -qO- --no-check-certificate --header "Authorization: token $FORGEJO_TOKEN" https://git.DOMAIN/devhub-templates/devhub-app-chart/archive/main.tar.gz | tar xz'
      - helm template APP_NAME devhub-app-chart -f k8s/values.yaml >/dev/null
      - echo "values.yaml renders cleanly"

  - name: test
    image: mcr.microsoft.com/dotnet/sdk:8.0
    commands:
      - dotnet test --logger "console;verbosity=normal"

  # Pull requests build but never push: untrusted code must not be able to
  # publish a tag other people might pull.
  - name: build
    image: moby/buildkit:v0.17.2-rootless
    # Rootless BuildKit builds in its own user+mount namespaces; the node's
    # default AppArmor profile denies the mount-propagation call rootlesskit
    # makes ("failed to share mount point: /"). This one step therefore runs
    # with AppArmor/seccomp unconfined — still unprivileged: no host mounts,
    # no added capabilities, no privileged flag.
    backend_options:
      kubernetes:
        securityContext:
          seccompProfile:
            type: Unconfined
          apparmorProfile:
            type: Unconfined
    environment:
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - mkdir -p ~/.docker
      - |
        cat > ~/.docker/config.json <<EOF
        {"auths":{"git.DOMAIN":{"username":"$REGISTRY_USER","password":"$REGISTRY_TOKEN"}}}
        EOF
      - |
        PUSH=false
        if [ "$CI_PIPELINE_EVENT" = "push" ]; then PUSH=true; fi
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --import-cache type=registry,ref=git.DOMAIN/devhub/APP_NAME:latest \
          --export-cache type=inline \
          --output type=image,\"name=git.DOMAIN/devhub/APP_NAME:$CI_COMMIT_SHA,git.DOMAIN/devhub/APP_NAME:latest\",push=$PUSH

  # ArgoCD watches k8s/ and syncs whatever image tag is committed there.
  - name: deploy
    image: alpine/git:latest
    environment:
      GIT_TOKEN:
        from_secret: registry_token
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
    commands:
      - git config user.email "ci@git.DOMAIN"
      - git config user.name "Woodpecker CI"
      # Quoted for YAML: the colon-space inside the sed pattern would otherwise
      # be parsed as a mapping and break the whole pipeline file.
      - 'sed -i "s|tag: .*|tag: $CI_COMMIT_SHA|" k8s/values.yaml'
      - git add k8s/values.yaml
      - git diff --cached --quiet && echo "no image change" && exit 0
      - git commit -m "[skip ci] deploy $CI_COMMIT_SHA"
      - git push origin HEAD:${CI_REPO_DEFAULT_BRANCH}
