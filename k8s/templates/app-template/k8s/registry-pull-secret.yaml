# ExternalSecret: pulls GitLab registry credentials from Vault and creates
# a docker-registry secret in this namespace. Requires:
#   - External Secrets Operator running on the workload cluster
#   - ClusterSecretStore 'vault-backend' pointing to the platform Vault
#   - Vault path secret/gitlab/registry-pull-token containing:
#       username: <deploy-token-username>
#       token:    <deploy-token-value>
#
# Created by: register-workload-cluster.sh
# Vault path populated by: register-workload-cluster.sh (GitLab Rails console)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-pull-secret
  namespace: devhub-APP_NAME
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: registry-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.DOMAIN": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: gitlab/registry-pull-token
        property: username
    - secretKey: token
      remoteRef:
        key: gitlab/registry-pull-token
        property: token
